<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cast Iraq — الإعدادات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body data-page="settings" class="dash-body">
<aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>Cast Iraq</span></a><div class="sidebar-user"><div class="avatar" id="sideAvatar">A</div><div><b id="sideName">User</b><span id="sideRole">Account</span></div></div><nav><a class="side-link" href="dashboard.html">▦ الداشبورد</a><a class="side-link active" href="settings.html">⚙ الإعدادات</a></nav><div class="sidebar-foot"><a href="index.html">← الموقع</a><button id="logoutBtn">تسجيل الخروج</button></div></aside>
<main class="dash-main"><header class="dash-top"><div><span class="muted">الحساب</span><h1>الإعدادات</h1></div></header>
<div class="settings-grid"><section class="panel"><h3>معلومات الحساب</h3><form id="accountSettings" class="form-grid"><label>الاسم<input id="setName"></label><label>الإيميل<input id="setEmail" type="email"></label><label>المدينة<select id="setCity"><option>بغداد</option><option>أربيل</option><option>البصرة</option><option>النجف</option><option>كربلاء</option></select></label><label>رقم الهاتف<input id="setPhone" placeholder="07xx xxx xxxx"></label><label class="full">نبذة<textarea id="setBio" rows="4"></textarea></label><div class="full"><button class="btn primary">حفظ التغييرات</button></div></form></section>
<section class="panel"><h3>الخصوصية والإشعارات</h3><div class="setting-row"><div><b>إظهار رقم الهاتف للشركات</b><span>يظهر فقط للحسابات الموثقة</span></div><input type="checkbox" id="setPhoneVisible"></div><div class="setting-row"><div><b>إشعارات Casting</b><span>فرص مطابقة لبروفايلك</span></div><input type="checkbox" id="setCastingNotif" checked></div><div class="setting-row"><div><b>إشعارات البريد</b><span>ملخص أسبوعي</span></div><input type="checkbox" id="setEmailNotif" checked></div></section>
<section class="panel danger-zone"><h3>الأمان</h3><button class="btn secondary" id="changePassBtn">تغيير كلمة المرور</button><button class="btn danger" id="deleteAccountBtn">حذف الحساب التجريبي</button></section></div>
</main><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
