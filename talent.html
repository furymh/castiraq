<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cast Iraq — بروفايل الموهبة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f3f6f9;font-family:Cairo,system-ui,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.container{width:min(1000px,calc(100% - 28px));margin:auto}.header{position:sticky;top:0;z-index:10;background:#080a0ddd;backdrop-filter:blur(15px);border-bottom:1px solid #20262e}.nav{height:66px;display:flex;align-items:center;gap:20px}.brand{font-weight:800;display:flex;align-items:center;gap:9px}.mark{width:33px;height:33px;background:white;color:#080a0d;border-radius:10px;display:grid;place-items:center}.navlinks{margin-inline-start:auto;display:flex;gap:18px;color:#9ca6b2;font-size:13px}.profile{padding:38px 0}.profile-head{display:grid;grid-template-columns:160px 1fr auto;gap:28px;align-items:center}.avatar{width:160px;height:160px;border-radius:50%;object-fit:cover;border:1px solid #323944}.name{display:flex;gap:9px;align-items:center}.name h1{font-size:28px;margin:0}.check{background:white;color:#090b0e;border-radius:50%;font-size:11px;padding:1px 5px}.meta{color:#8f99a6;margin-top:5px}.bio{color:#c2c9d1;max-width:630px;line-height:1.8;font-size:13px}.stats{display:flex;gap:25px;margin-top:14px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:#7d8793}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer}.btn.primary{background:white;color:#080a0d}.btn.ghost{background:#12161b;color:white;border:1px solid #252c35}.skills{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.pill{background:#11161c;border:1px solid #232a33;border-radius:999px;padding:6px 10px;font-size:11px;color:#aeb7c1}.tabs{display:flex;gap:5px;border-bottom:1px solid #20262e;margin-top:35px}.tabs button{border:0;background:transparent;color:#7f8996;padding:12px 15px;cursor:pointer;border-bottom:2px solid transparent}.tabs button.active{color:white;border-color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px}.tile{position:relative;aspect-ratio:1/1;background:#11161c;overflow:hidden;cursor:pointer}.tile img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:8px;right:8px;background:#000b;padding:4px 7px;border-radius:8px;font-size:10px}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#808a96}.back{display:inline-block;color:#9ba5b1;font-size:12px;margin-bottom:20px}.modal{position:fixed;inset:0;background:#000d;z-index:50;display:none;place-items:center;padding:18px}.modal.show{display:grid}.modalbox{width:min(700px,100%);background:#0e1217;border:1px solid #252c35;border-radius:18px;overflow:hidden}.modalmedia{max-height:75vh;background:#050607;display:grid;place-items:center}.modalmedia img,.modalmedia video{max-width:100%;max-height:75vh}.modalcopy{padding:12px 15px;font-size:12px;color:#bec6cf}.close{position:fixed;top:18px;left:18px;border:0;background:#fff;color:#000;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.worklist{display:grid;gap:10px;margin-top:14px}.workrow{background:#101419;border:1px solid #20262e;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:14px}.workrow small{display:block;color:#7e8996;margin-top:4px}
@media(max-width:700px){.navlinks{display:none}.profile{padding-top:24px}.profile-head{grid-template-columns:92px 1fr;gap:16px;align-items:start}.avatar{width:92px;height:92px}.profile-actions{grid-column:1/-1;display:flex;gap:8px}.profile-actions .btn{flex:1}.name h1{font-size:20px}.bio{font-size:12px}.stats{gap:15px}.grid{gap:2px}.tabs{overflow:auto}.tabs button{white-space:nowrap}.workrow{display:block}}
</style></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="mark">C</span>Cast Iraq</a><nav class="navlinks"><a href="feed.html">تصفح</a><a href="index.html#talents">المواهب</a><a href="index.html#casting">الكاستنغ</a><a href="dashboard.html">الداشبورد</a></nav></div></header><main class="profile"><div class="container"><a class="back" href="feed.html">← الرجوع للتصفح</a><section id="head"></section><div class="tabs"><button class="active" data-tab="all">الكل</button><button data-tab="photo">الصور</button><button data-tab="video">الفيديوهات</button><button data-tab="work">الأعمال</button></div><section id="content"></section></div></main><div class="modal" id="modal"><button class="close" id="close">×</button><div class="modalbox"><div class="modalmedia" id="modalMedia"></div><div class="modalcopy" id="modalCopy"></div></div></div><script>
(()=>{'use strict';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let ts=[],ps=[];try{ts=JSON.parse(localStorage.getItem('castiraq_talents')||'[]');ps=JSON.parse(localStorage.getItem('castiraq_social_posts')||'[]')}catch{}if(!ts.length){location.href='feed.html'}const id=new URLSearchParams(location.search).get('id')||ts[0]?.id,t=ts.find(x=>String(x.id)===String(id))||ts[0];const my=ps.filter(p=>String(p.talentId)===String(t.id));const skills=t.skills||['Commercial','Lifestyle','Casting'];$('#head').innerHTML=`<div class="profile-head"><img class="avatar" src="${esc(t.image||'')}" alt=""><div><div class="name"><h1>${esc(t.name||'موهبة')}</h1>${t.verified?'<span class="check">✓</span>':''}</div><div class="meta">${esc(t.type||'موهبة')} • ${esc(t.city||'العراق')}${t.age?' • '+esc(t.age)+' سنة':''}</div><p class="bio">${esc(t.bio||'بروفايل مهني على Cast Iraq لعرض الصور، الفيديوهات، الـShowreel والأعمال السابقة أمام شركات الإنتاج والمخرجين.')}</p><div class="stats"><div class="stat"><b>${my.length}</b><span>منشور</span></div><div class="stat"><b>${my.filter(x=>x.mediaType==='video').length}</b><span>فيديو</span></div><div class="stat"><b>${my.filter(x=>x.kind==='work').length}</b><span>عمل</span></div></div><div class="skills">${skills.slice(0,6).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div></div><div class="profile-actions"><button class="btn primary" id="shortlist">+ Shortlist</button><a class="btn ghost" href="feed.html">عرض الـFeed</a></div></div>`;$('#shortlist').onclick=()=>alert('تمت الإضافة إلى Shortlist — نسخة تجريبية');let tab='all';function draw(){let a=my.slice().sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));if(tab==='photo')a=a.filter(x=>x.mediaType==='photo');if(tab==='video')a=a.filter(x=>x.mediaType==='video');if(tab==='work')a=a.filter(x=>x.kind==='work');if(tab==='work'){$('#content').innerHTML=a.length?`<div class="worklist">${a.map(p=>`<article class="workrow"><div><b>${esc(p.project||'عمل سابق')}</b><small>${esc(p.brand||'')} ${p.creditRole?'• '+esc(p.creditRole):''}</small></div><small>${esc(p.caption||'')}</small></article>`).join('')}</div>`:'<div class="empty">ماكو أعمال مضافة بعد.</div>';return}$('#content').innerHTML=a.length?`<div class="grid">${a.map(p=>`<div class="tile" data-post="${esc(p.id)}"><img src="${esc(p.mediaType==='video'?(p.coverUrl||t.image):p.mediaUrl)}" alt="">${p.mediaType==='video'?'<span class="badge">▶ VIDEO</span>':''}${p.kind==='work'?'<span class="badge" style="top:auto;bottom:8px">WORK</span>':''}</div>`).join('')}</div>`:'<div class="empty">ماكو محتوى بهذا القسم.</div>';$$('[data-post]').forEach(x=>x.onclick=()=>open(a.find(p=>p.id===x.dataset.post)))}function open(p){if(!p)return;$('#modalMedia').innerHTML=p.mediaType==='video'?`<video controls autoplay poster="${esc(p.coverUrl||'')}"><source src="${esc(p.mediaUrl||'')}"></video>`:`<img src="${esc(p.mediaUrl||'')}" alt="">`;$('#modalCopy').innerHTML=`<b>${esc(p.project||t.name)}</b><br>${esc(p.caption||'')}`;$('#modal').classList.add('show')}$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;draw()});draw()})();
</script></body></html>
